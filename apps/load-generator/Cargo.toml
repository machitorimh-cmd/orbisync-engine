[package]
name = "orbisync-load-generator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "OrbiSync load generator — drives real traffic via public REST and WebSocket contracts"
publish = false

# Standalone binary; intentionally NOT a member of the workspace (`crates/*`).
# See `docs/design/repo-crate-conventions.md` §2.1 — load_test_tooling lives in
# `apps/load-generator` outside the workspace and must not depend on server
# internals. It drives the server through the public contract only (OpenAPI + `.proto`).
[workspace]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tungstenite = { version = "0.29" }
futures-util = "0.3"
prost = "0.14"
prost-types = "0.14"
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }

[lints.rust]
missing_docs = "allow"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"
manual_strip = "allow"
collapsible_if = "allow"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
