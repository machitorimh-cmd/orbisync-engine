<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrbiSync 共同ホワイトボード</title></head>
<body><main><header><div><p class="eyebrow">ORBISYNC / SHARED SPACE</p><h1>共同ホワイトボード</h1><p class="subtitle">付箋を置いて、考えを一緒に動かす。</p></div><span id="connection" class="status offline">未接続</span></header>
<section class="panel auth"><h2>接続</h2><div class="form-grid"><label>サーバー<input id="server" value="http://127.0.0.1:18081"></label><label>参加方式<select id="authMethod"><option value="local">アカウント</option><option value="guest">ゲスト</option><option value="name_only">名前のみ</option></select></label></div><div id="localFields" class="form-grid"><label>ログインID<input id="loginId" value="admin" autocomplete="username"></label><label>パスワード<input id="password" type="password" autocomplete="current-password"></label></div><div id="nameFields" class="form-grid" hidden><label>表示名<input id="displayName" placeholder="表示名" autocomplete="nickname"></label></div><div class="form-grid"><button id="login">参加</button></div><p id="authMessage" class="message">参加方式を選んでボードに入室してください。</p></section>
<section class="panel board-controls"><div><h2>ボード</h2><p id="boardInfo">未選択</p></div><div class="controls"><select id="instances" aria-label="instance"><option value="">instanceを読み込み</option></select><button id="load">一覧</button><button id="join" class="primary">入室</button><button id="add" class="accent" disabled>＋ 付箋</button></div></section>
<section class="workspace"><div id="board" class="board" tabindex="0" aria-label="共同ホワイトボード"></div><aside class="panel side"><h2>操作</h2><p>付箋をドラッグして移動。選択すると編集できます。</p><dl><div><dt>接続</dt><dd id="syncState">待機中</dd></div><div><dt>付箋</dt><dd id="count">0</dd></div></dl><p class="notice"><strong>ロックルール</strong><br>ロックの正本はCoreが持つ付箋componentです。ロック・解除も通常の更新コマンドとして送り、Coreのpre-commit hookがallow/denyを返します。画面はCoreの確定だけを表示し、拒否は<code>PRE_COMMIT_DENIED</code>としてログに出ます。</p><div id="pendingNotes" aria-live="polite"></div><pre id="log" aria-live="polite"></pre></aside></section></main><script type="module" src="/src/main.ts"></script></body></html>
