[package]
name = "orbisync-server"
description = "OrbiSync server binary: composition root, wiring and graceful shutdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "orbisync-server"
path = "src/main.rs"

# Dependency rule (`repo-crate-conventions.md` §3.2): `server` is the
# Composition Root and may depend on every crate. It holds no business logic
# (specification §30.8).
[dependencies]
base64 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
prost = { workspace = true }
prost-types = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
orbisync-application = { workspace = true }
orbisync-config = { workspace = true }
orbisync-domain = { workspace = true }
orbisync-extensions = { workspace = true }
orbisync-identity = { workspace = true }
orbisync-interest = { workspace = true }
orbisync-observability = { workspace = true }
orbisync-protocol = { workspace = true }
orbisync-realtime = { workspace = true }
orbisync-storage-postgres = { workspace = true }
orbisync-transport-http = { workspace = true }
orbisync-world-directory = { workspace = true }
orbisync-world-runtime = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
reqwest = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
hyper = "1"
tokio = { workspace = true, features = ["test-util"] }
orbisync-world-runtime = { workspace = true, features = ["test-support"] }
criterion = { version = "0.8", features = ["html_reports"] }
orbisync-testkit = { workspace = true }
pollster = { workspace = true }

[[bench]]
name = "filter_hot_path"
harness = false

[lints]
workspace = true
