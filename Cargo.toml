[workspace]
resolver = "3"
members = ["crates/*", "tests/integration"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["OrbiSync contributors"]
publish = false

# Shared dependency versions. Adapter-only crates (Axum, SQLx, Tokio) are listed
# here for version alignment; the allowed dependency matrix in
# `docs/design/repo-crate-conventions.md` §3.2 decides which crate may use them.
[workspace.dependencies]
orbisync-application = { path = "crates/orbisync-application" }
orbisync-config = { path = "crates/orbisync-config" }
orbisync-domain = { path = "crates/orbisync-domain" }
orbisync-extensions = { path = "crates/orbisync-extensions" }
orbisync-identity = { path = "crates/orbisync-identity" }
orbisync-interest = { path = "crates/orbisync-interest" }
orbisync-observability = { path = "crates/orbisync-observability" }
orbisync-protocol = { path = "crates/orbisync-protocol" }
orbisync-realtime = { path = "crates/orbisync-realtime" }
orbisync-server = { path = "crates/orbisync-server" }
orbisync-storage-postgres = { path = "crates/orbisync-storage-postgres" }
orbisync-testkit = { path = "crates/orbisync-testkit" }
orbisync-transport-http = { path = "crates/orbisync-transport-http" }
orbisync-world-directory = { path = "crates/orbisync-world-directory" }
orbisync-world-runtime = { path = "crates/orbisync-world-runtime" }

async-trait = "0.1"
argon2 = "0.6"
axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
http-body-util = "0.1"
http-body = "1"
generic-array = "1.4"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
hmac = "0.12"
ipnet = "2"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
pollster = "0.4"
proptest = "1"
passwords = { version = "=3.1.18", default-features = false, features = ["common-password"] }
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protox = "0.9"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
    "migrate",
    "uuid",
    "time",
] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = "0.5"
toml = "0.9"
tower-http = { version = "0.6", features = ["trace", "timeout", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
prometheus-client = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# Coding conventions from `docs/design/repo-crate-conventions.md` §7.1 and
# specification §31.1, enforced by `cargo clippy --all-targets --all-features
# -- -D warnings`. Every member opts in with `[lints] workspace = true`.
#
# `deny` (not `forbid`) is deliberate: test code re-allows `unwrap_used` and
# `expect_used` locally, and generated protocol code re-allows `missing_docs`.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
expect_used = "deny"
let_underscore_must_use = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# W-29 Argon2id dev optimization (CPU-bound root cause):
# orbisync-identity uses Argon2id with MEMORY_KIB=65536, TIME_COST=3, PARALLELISM=1.
# In unoptimized dev builds a single hash takes ~3.10s (measured: 3.08s startup
# 2.92s, second 2.58s). Test w29_pagination_users creates 250 users => ~250*3.1s
# ≈775s (≈13 minutes) of pure CPU work. With tokio::test default current_thread
# runtime, 5 tests running in parallel saturate all cores, the driver is not
# scheduled, and sqlx pool / HTTP timeouts fire after ~47s, failing all 5 tests.
# Optimizing only the hot crate (not the whole workspace) brings one hash down
# to ~187ms (measured: 0.172s, startup 0.190s), ~16.6x faster, so the same 250
# hashes need ~45s total and parallel execution no longer times out. Whole-
# workspace opt-level would blow up build time, so we scope to the bottleneck
# crate. Argon2id m=65536 t=3 p=1 (out=32) を単独プロジェクトで計測: opt-level=0 で 3.10s, opt-level=3 で 0.187s (当環境実測: 3.08s -> 0.172s).
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
